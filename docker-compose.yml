# 14 2장 2단계 구성(postgres·redis·api). 실시간 전송은 MVP 단일 백엔드라 api에 포함 (12 6장). web은 md_frontend 방침에 따라 화면 도안·서버 계약 확정 후 추가한다.
# 기동: docker compose up --build
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: shuttlebus
    ports:
      # 이 PC에서만 접속. 0.0.0.0으로 열면 같은 네트워크 누구나 기본 비밀번호로 DB에 붙는다
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shuttlebus"]
      interval: 3s
      timeout: 3s
      retries: 20

  # 상태 캐시·Socket.IO 인스턴스 간 전달. 기준 데이터가 아니다 — 지워도 DB에서 복원된다 (12 5장)
  redis:
    image: redis:8
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # 단일 초기화 작업: 마이그레이션 → 멱등 시드 → 회차 보충 (14 8·10장)
  migrate:
    build: ./api
    command: sh -c "alembic upgrade head && python -m app.seed && python -m app.jobs ensure-trips --days 14"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/shuttlebus
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/shuttlebus
      # 루트 .env에 JWT_SECRET을 정한다. 없으면 개발용 기본값(운영 금지)
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me}
      # production이면 기본·짧은 JWT_SECRET으로 기동하지 않는다
      APP_ENV: ${APP_ENV:-development}
      REDIS_URL: redis://redis:6379/0
      # 브라우저 화면의 출처. 루트 .env에 CORS_ORIGINS=http://localhost:3000 처럼 적는다
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  pgdata:
